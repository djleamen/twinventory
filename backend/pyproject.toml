[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"browserbase>=1.2,<2",
	"elasticsearch>=9,<10",
	"elevenlabs>=1,<2",
	"fastapi>=0.116,<1",
	"playwright>=1.47,<2",
	"openai>=3.16.2",
	"pillow>=12,<13",
	"pymongo>=4.11,<5",
	"python-dotenv>=1,<2",
	"python-multipart",
	"rembg[cpu]",
	"requests>=2.34.2",
	"uvicorn[standard]>=0.35,<1",
	"sentry-sdk[fastapi,openai]>=2.60,<3",
]

[tool.setuptools]
py-modules = ["main", "utils"]

[tool.setuptools.packages.find]
include = ["routers*", "services*"]
